<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="940" viewBox="0 0 1520 940">
  <title>Unspoken Concepts Challenge</title>
  <desc>A schematic Arabic question, unspoken spider concept in English and Chinese, and Russian answer. English translations align below the plot.</desc>
  <!-- Editable schematic; render to PNG with just plot-cartoon. PI/OpenAI. -->
  <style>
    text { font-family: 'DejaVu Sans', 'Noto Sans CJK SC', sans-serif; text-anchor: middle; fill: #222; }
    .title { font-size: 38px; }
    .subtitle { font-size: 30px; font-weight: bold; }
    .context, .language, .axis, .translation-label { font-size: 24px; fill: #555; }
    .role { font-size: 28px; font-weight: bold; }
    .word { font-size: 32px; }
    .translation { font-size: 30px; }
    .annotation { font-size: 30px; }
    .input { fill: #333; }
    .thought { fill: #8a3200; }
    .output { fill: #00456e; }
    .arabic { font-family: 'Noto Sans Arabic', sans-serif; direction: rtl; }
    .curve { fill-opacity: 0.12; stroke-width: 6; }
  </style>
  <defs>
    <path id="input" d="M137 470 C230 425 285 421 355 447 C510 499 600 612 755 659 C935 714 1110 710 1490 710"/>
    <path id="thought" d="M137 710 L490 710 C645 710 710 644 780 510 C843 381 867 303 920 303 C973 303 997 381 1060 510 C1130 644 1195 710 1350 710 L1490 710"/>
    <path id="output" d="M137 710 L640 710 C925 710 1060 688 1170 605 C1300 507 1360 365 1490 296"/>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#333" stroke-width="2.5"/>
    </marker>
    <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#d55e00" stroke-width="2.5"/>
    </marker>
  </defs>
  <rect width="1520" height="940" fill="white"/>
  <text class="title" x="760" y="46">Unspoken Concepts Challenge</text>
  <a href="https://github.com/wassname/unspoken-concepts"><text x="760" y="80" style="font-size:20px;fill:#777">github.com/wassname/unspoken-concepts</text></a>
  <text class="subtitle" x="760" y="129">Find the unspoken intermediate concepts in a language model.</text>
  <text class="context" x="760" y="165">Arabic question → Russian answer</text>

  <path d="M137 470 C230 425 285 421 355 447 C510 499 600 612 755 659 C935 714 1110 710 1490 710 L137 710 Z" fill="#7f7f7f" fill-opacity="0.12"/>
  <use href="#input" fill="none" stroke="#7f7f7f" stroke-width="6"/>
  <use href="#thought" class="curve" fill="#d55e00" stroke="#d55e00"/>
  <path d="M137 710 L640 710 C925 710 1060 688 1170 605 C1300 507 1360 365 1490 296 L1490 710 Z" fill="#0072b2" fill-opacity="0.12"/>
  <use href="#output" fill="none" stroke="#0072b2" stroke-width="6"/>
  <path d="M137 198 V710 H1490" stroke="#222" stroke-width="2" fill="none"/>
  <text class="axis" transform="translate(75 455) rotate(-90)"><tspan x="0" dy="0">how strongly the model</tspan><tspan x="0" dy="29">represents each part</tspan></text>
  <text class="axis" x="1490" y="755" style="text-anchor:end">layers →</text>

  <text class="annotation" x="545" y="384">not this</text>
  <path d="M536 399 L445 479" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="annotation thought" x="1100" y="271" style="font-weight:bold">find this</text>
  <path d="M1078 285 L980 348" fill="none" stroke="#d55e00" stroke-width="4" marker-end="url(#orange-arrow)"/>
  <text class="annotation" x="1380" y="240">not this</text>
  <path d="M1394 256 L1426 353" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>

  <g class="input">
    <text class="role input" x="353" y="554">INPUT</text>
    <text class="language" x="353" y="589">Arabic</text>
    <text class="word arabic input" x="353" y="632">كم عدد أرجل الحيوان</text>
    <text class="word arabic input" x="353" y="673">الذي ينسج الشباك؟</text>
  </g>
  <g class="thought">
    <text class="role thought" x="920" y="554">THOUGHTS</text>
    <text class="language" x="920" y="589">English / Chinese</text>
    <text class="word thought" x="920" y="652">spider / 蜘蛛</text>
  </g>
  <g class="output">
    <text class="role output" x="1360" y="554">OUTPUT</text>
    <text class="language" x="1360" y="589">Russian</text>
    <text class="word output" x="1360" y="652">восемь</text>
  </g>

  <path d="M137 790 H1490" stroke="#bbb" stroke-width="1.5"/>
  <text class="translation-label" x="137" y="826" style="text-anchor:start">English translations</text>
  <text class="translation" x="353" y="874"><tspan x="353">How many legs on a</tspan><tspan x="353" dy="36">web-spinning animal?</tspan></text>
  <text class="translation" x="920" y="892">spider / spider</text>
  <text class="translation" x="1360" y="892">eight</text>
</svg>
