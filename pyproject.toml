[project]
name = "unspoken-concepts"
version = "0.1.0"
description = "Unspoken Concepts Challenge: find unspoken intermediate concepts in model activations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.10",
    "numpy>=2",
    "tabulate>=0.9",
    "torch>=2.8",
    "transformers>=5.5",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
