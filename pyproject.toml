[project]
name = "suppressed-activations"
version = "0.1.0"
description = "Find and intervene on per-sample suppressed activation subspaces"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.10",
    "ipykernel>=6.30",
    "jupytext>=1.17",
    "matplotlib>=3.10",
    "nbconvert>=7.16",
    "numpy>=2",
    "tabulate>=0.9",
    "torch>=2.8",
    "transformers>=5.5",
]

[tool.ruff]
line-length = 100
